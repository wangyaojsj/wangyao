<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案例2-底部Tab导航【红点彻底修复】</title>
    <script src="http://at.alicdn.com/t/c/font_5231396_mb4r5c4em5.js"></script>
    <style>
        .icon {
            width: 1em;
            height: 1em;
            vertical-align: -0.15em;
            fill: currentColor;
            overflow: hidden;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        /* 底部导航容器 flex布局平分宽度 */
        .tab-nav {
            display: flex;
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            border-top: 1px solid #eee;
        }
        .tab-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #666;
            position: relative; /* 红点绝对定位父容器，重点！ */
            padding: 8px 0;
        }
        .tab-item svg {
            font-size: 24px;
            margin: 5px;
        }
        /* 激活样式：选中之后变色 */
        .tab-item.active {
            color: #ff7d00;
        }
        /* ========== 三种红点样式，全部改为div，盒模型稳定 ========== */
        /* 样式1：小圆点红点，无数字 */
        .badge-dot {
            position: absolute;
            top: 4px;
            right: 22px;
            width: 8px;
            height: 8px;
            background-color: #f53f3f;
            border-radius: 50%;
        }

        /* 样式2：数字角标红点 */
        .badge-num {
            position: absolute;
            top: 2px;
            right: 14px;
            min-width: 18px;
            height: 18px;
            padding: 0 4px;
            background-color: #f53f3f;
            border-radius: 9px;
            color: #fff;
            font-size: 12px;
            text-align: center;
            line-height: 18px;
        }
        .badge-num.max {
            font-size: 10px;
        }

        /* 样式3：带白色描边红点 */
        .badge-border {
            position: absolute;
            top: 4px;
            right: 22px;
            width: 8px;
            height: 8px;
            background-color: #f53f3f;
            border: 2px solid #fff;
            border-radius: 50%;
        }

        /* 隐藏类：使用透明度，元素保留在渲染树，不会出现空元素渲染bug */
        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* 演示按钮样式 */
        .demo-box {
            padding: 20px;
        }
        .demo-btn {
            padding: 6px 12px;
            margin: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h3 style="padding:20px 20px 0;">案例2：移动端底部导航栏（三种消息红点 + 显隐演示【最终稳定版】）</h3>
    <div class="demo-box">
        <button class="demo-btn" onclick="toggleBadge('badgeHome')">切换【首页小圆点】</button>
        <button class="demo-btn" onclick="toggleBadge('badgeCart')">切换【购物车数字角标】</button>
        <button class="demo-btn" onclick="toggleBadge('badgeAddr')">切换【地址描边红点】</button>
        <button class="demo-btn" onclick="toggleBadge('badgeUser')">切换【我的99+角标】</button>
    </div>

    <!-- 底部导航 -->
    <div class="tab-nav">
        <div class="tab-item active" onclick="changeTab(this)">
            <svg class="icon icon-home" aria-hidden="true">
                <use xlink:href="#icon-a-shouyechangguishouye-copy"></use>
            </svg>
            <span>首页</span>
            <!-- 改为div，不再使用空span -->
            <div class="badge-dot" id="badgeHome"></div>
        </div>
        
        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon icon-cart" aria-hidden="true">
                <use xlink:href="#icon-gouwuche"></use>
            </svg>
            <span>购物车</span>
            <div class="badge-num" id="badgeCart">5</div>
        </div>
        <div class="tab-item" onclick="changeTab(this)">
            <svg  class="icon icon-dizhi" aria-hidden="true">
                <use xlink:href="#icon-dizhi"></use>
            </svg>
            <span>地址</span>
            <div class="badge-border" id="badgeAddr"></div>
        </div>
        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon icon-user" aria-hidden="true">
                <use xlink:href="#icon-wode"></use>
            </svg>
            <span>我的</span>
            <div class="badge-num max" id="badgeUser">99+</div>
        </div>
    </div>

    <script>
        // Tab切换
        function changeTab(current) {
            let tabs = document.querySelectorAll(".tab-item");
            for (let i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove("active");
            }
            current.classList.add("active");
        }

        // 红点切换
        function toggleBadge(badgeId) {
            const badge = document.getElementById(badgeId);
            badge.classList.toggle('hidden');
        }
    </script>
</body>
</html>
