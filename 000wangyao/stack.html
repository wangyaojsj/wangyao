<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>CSS层叠与盒模型课堂案例</title>
    <style>
        /* ========== 1. 继承演示：父容器设置，子元素自动继承font、color
        sans-serif ========== */
        body {
            color: blue;
            background-color: #f5f7fa;
            /* 子元素默认继承字体和文字颜色，但不会继承margin/padding/border */
        }

        /* 全局重置：统一盒模型，重点！border-box 内边距边框不会撑大盒子宽度 */
        * {
            box-sizing: border-box;
            /* IE盒模型，课堂重点 */
            margin: 0;
            padding: 0;
        }

        .container {
            width: 1200px;
            margin: 40px auto;
            /* 上下外边距40px，左右auto居中 */
            background-color: yellow;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .card-wrap {
            background-color: pink;
        }

        /* 后代选择器> */
        /* .container .card-wrap {
            display: flex;
            gap: 24px;
            background-color: green;
        } */
        #card-wrap {
            display: flex;
            gap: 24px;
            background-color: purple;
        }

        /* ========== 2. 盒模型核心：content + padding + border + margin ========== */
        .card {
            width: 384px;
            /* content宽度：384px，padding、border向内占用空间 */
            padding: 20px;
            border: 1px solid #e4e7ed;
            border-radius: 12px;
            background-color: #fff;
            /* margin：盒子外部空白 */
            margin: 10px auto;
        }

        .card-img {
            width: 100%;
            height: 220px;
            background-color: #87CEEB;
            border-radius: 8px;
            /* margin-bottom：图片下方外边距，和文字拉开距离 */
            margin-bottom: 16px;
        }

        .card-title {
            font-size: 20px;
            margin-bottom: 12px;
        }

        .card-desc {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 16px;
            color: #666;
        }

        .price {
            font-size: 22px;
            color: #f56c6c;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>精选商品卡片</h2>
        <div class="card-wrap" id="card-wrap">
            <!-- 普通卡片 -->
            <div class="card">
                <div class="card-img"></div>
                <h3 class="card-title">基础款商品</h3>
                <p class="card-desc">基础盒模型。padding内边距，border边框，margin外边距。</p>
                <div class="price">¥199</div>
            </div>
        </div>
    </div>
</body>

</html>
